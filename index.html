<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대한민국 정치·외교 실시간 브리핑</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#18212b;--muted:#6b7280;--line:#d9dee5;--navy:#1f3a5f;--teal:#1f6f78;--danger:#9f2f2f;--ok:#2f6b3d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);padding:24px 28px;position:sticky;top:0;z-index:10}
h1{margin:0 0 6px;font-size:28px}.subtitle{color:var(--muted);font-size:14px}
.toolbar,.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button,select,input{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:8px;font-size:14px}
button{cursor:pointer}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}
main{max-width:1180px;margin:0 auto;padding:24px}.status-grid,.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat,.panel,.issue{background:var(--card);border:1px solid var(--line);border-radius:12px}
.stat{padding:16px}.stat .value{font-size:24px;font-weight:700;margin-top:6px}.muted{color:var(--muted)}
.notice{padding:12px 14px;background:#fff8e6;border:1px solid #ecd9a5;border-radius:10px;margin-bottom:16px}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:24px 0 12px}
.issue{padding:18px;margin-bottom:12px;break-inside:avoid}.issue.domestic{border-left:5px solid var(--navy)}.issue.foreign{border-left:5px solid var(--teal)}
.issue h3{margin:8px 0;font-size:20px}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:12px;padding:4px 7px;border-radius:999px;background:#eef2f6}
.badge.core{background:#f8e1e1;color:var(--danger)}.badge.verified{background:#e5f3e7;color:var(--ok)}
.issue details{margin-top:10px}.source-list{padding-left:18px}.source-list a{color:#174a7c;word-break:break-all}
.empty{padding:32px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
@media(max-width:800px){.status-grid,.summary-grid{grid-template-columns:repeat(2,1fr)}header{position:static}h1{font-size:22px}}
@media print{
  body{background:white}header{position:static;border:0;padding:0 0 16px}.toolbar,.filters,.notice,.no-print{display:none!important}
  main{max-width:none;padding:0}.issue,.stat,.panel{box-shadow:none}.issue{page-break-inside:avoid}
  @page{size:A4 portrait;margin:15mm}
}
</style>
</head>
<body>
<header>
  <h1>대한민국 정치·외교 실시간 브리핑</h1>
  <div class="subtitle">국내 정치와 외교·대외관계의 주요 진전 및 공식 발표</div>
  <div class="toolbar">
    <button class="tab active" data-cat="전체">전체</button>
    <button class="tab" data-cat="국내 정치">국내 정치</button>
    <button class="tab" data-cat="외교·대외관계">외교·대외관계</button>
    <button id="printBtn">인쇄 / PDF</button>
    <button id="refreshBtn">새로고침</button>
  </div>
  <div class="filters">
    <select id="viewMode">
      <option value="realtime">실시간</option>
      <option value="today">오늘</option>
      <option value="yesterday">어제</option>
      <option value="daily">일별</option>
      <option value="monthly">월별</option>
    </select>
    <input type="date" id="dateFilter">
    <input type="month" id="monthFilter">
    <select id="importanceFilter">
      <option value="">전체 중요도</option><option>핵심</option><option>주요</option><option>참고</option>
    </select>
    <select id="countryFilter"><option value="">전체 국가·지역</option></select>
    <input id="searchInput" placeholder="제목·본문 검색">
    <button id="resetBtn">필터 초기화</button>
  </div>
</header>
<main>
  <div id="notice" class="notice"></div>
  <section class="status-grid" id="statusGrid"></section>
  <div class="section-title"><h2 id="sectionHeading">실시간 주요 이슈</h2><span id="resultCount" class="muted"></span></div>
  <section id="issueList"></section>
</main>
<script>
let store={meta:{},issues:[]}, category="전체";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=s=>s?new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(s)):'-';
const kstDate=(d=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(d);

async function loadData(){
  try{
    const r=await fetch('data.json?ts='+Date.now());
    if(!r.ok) throw new Error('data.json load failed');
    store=await r.json();
  }catch(e){
    document.querySelector('#notice').textContent='data.json을 불러오지 못했습니다. 로컬에서는 간단한 웹서버로 실행하세요.';
    return;
  }
  initCountries(); render();
}
function initCountries(){
  const countries=[...new Set(store.issues.flatMap(x=>x.countries||[]))].sort();
  $('#countryFilter').innerHTML='<option value="">전체 국가·지역</option>'+countries.map(x=>`<option>${x}</option>`).join('');
}
function filtered(){
  const mode=$('#viewMode').value, date=$('#dateFilter').value, month=$('#monthFilter').value;
  const imp=$('#importanceFilter').value, country=$('#countryFilter').value, q=$('#searchInput').value.trim().toLowerCase();
  const today=kstDate(), y=new Date(); y.setDate(y.getDate()-1); const yesterday=kstDate(y);
  return store.issues.filter(x=>{
    const d=x.occurredAt.slice(0,10);
    if(category!=='전체' && x.primaryCategory!==category && x.relatedCategory!==category) return false;
    if(mode==='today' && d!==today) return false;
    if(mode==='yesterday' && d!==yesterday) return false;
    if(mode==='daily' && date && d!==date) return false;
    if(mode==='monthly' && month && !d.startsWith(month)) return false;
    if(imp && x.importance!==imp) return false;
    if(country && !(x.countries||[]).includes(country)) return false;
    if(q && !JSON.stringify(x).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
}
function renderStatus(items){
  const counts={
    "전체":items.length,
    "국내 정치":items.filter(x=>x.primaryCategory==='국내 정치').length,
    "외교·대외관계":items.filter(x=>x.primaryCategory==='외교·대외관계').length,
    "확인 중":items.filter(x=>x.status==='확인 중').length
  };
  $('#statusGrid').innerHTML=Object.entries(counts).map(([k,v])=>`<div class="stat"><div class="muted">${k}</div><div class="value">${v}</div></div>`).join('');
}
function render(){
  const items=filtered();
  $('#notice').innerHTML=`<b>데이터 상태:</b> ${store.meta.notice||''}<br><span class="muted">마지막 정상 업데이트: ${fmt(store.meta.lastSuccessfulUpdate)} · 다음 예정: ${fmt(store.meta.nextScheduledUpdate)}</span>`;
  renderStatus(items); $('#resultCount').textContent=`${items.length}건`;
  const mode=$('#viewMode').value;
  $('#sectionHeading').textContent={realtime:'실시간 주요 이슈',today:'오늘의 이슈',yesterday:'어제의 확정 브리핑',daily:'일별 브리핑',monthly:'월별 아카이브'}[mode];
  $('#issueList').innerHTML=items.length?items.map(issueCard).join(''):'<div class="empty">조건에 맞는 이슈가 없습니다.</div>';
}
function issueCard(x){
  const cls=x.primaryCategory==='국내 정치'?'domestic':'foreign';
  const sources=(x.sources||[]).map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.name} — ${s.title} (${s.date})</a></li>`).join('');
  const countries=(x.countries||[]).join(', ')||'해당 없음';
  return `<article class="issue ${cls}">
    <div class="badges">
      <span class="badge">${x.primaryCategory}</span>
      <span class="badge">${x.subcategory}</span>
      <span class="badge ${x.importance==='핵심'?'core':''}">${x.importance}</span>
      <span class="badge ${x.status==='공식 발표 확인'?'verified':''}">${x.status}</span>
    </div>
    <h3>${x.title}</h3>
    <div class="muted">발생: ${fmt(x.occurredAt)} · 최종 업데이트: ${fmt(x.updatedAt)} · 관련 국가: ${countries}</div>
    <p>${x.summary}</p>
    <details><summary>세부 내용 및 출처</summary>
      ${x.background?`<p><b>배경</b><br>${x.background}</p>`:''}
      ${x.significance?`<p><b>주요 쟁점 및 의미</b><br>${x.significance}</p>`:''}
      ${x.nextSchedule?`<p><b>향후 일정</b><br>${x.nextSchedule}</p>`:''}
      <p><b>출처</b></p><ul class="source-list">${sources}</ul>
    </details>
  </article>`;
}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');category=b.dataset.cat;render()});
['viewMode','dateFilter','monthFilter','importanceFilter','countryFilter'].forEach(id=>$('#'+id).onchange=render);
$('#searchInput').oninput=render;
$('#resetBtn').onclick=()=>{category='전체';$$('.tab').forEach((x,i)=>x.classList.toggle('active',i===0));$('#viewMode').value='realtime';$('#dateFilter').value='';$('#monthFilter').value='';$('#importanceFilter').value='';$('#countryFilter').value='';$('#searchInput').value='';render()};
$('#printBtn').onclick=()=>window.print();
$('#refreshBtn').onclick=loadData;
setInterval(loadData,5*60*1000);
loadData();
</script>
</body>
</html>
